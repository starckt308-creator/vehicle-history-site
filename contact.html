<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact</title><link rel="stylesheet" href="styles.css"></head><body data-page="contact"><header id="site-header"></header><main><section class="page-hero"><div class="container"><span class="eyebrow">GET IN TOUCH</span><h1>Contact</h1><p>This is a local prototype. The form below previews the interface but does not send messages to a server.</p></div></section><section class="container content"><form id="contact-form" class="contact-form"><div class="notice">Demo form only — do not enter sensitive or private information.</div><label for="name">Your name</label><input id="name" required maxlength="100" placeholder="Name"><label for="email">Email address</label><input id="email" type="email" required maxlength="150" placeholder="you@example.com"><label for="message">Message</label><textarea id="message" required maxlength="1500" placeholder="How can we help?"></textarea><button class="btn btn-primary" type="submit" style="margin-top:16px">Preview submission →</button><p id="contact-result" role="status"></p></form></section></main><footer id="site-footer"></footer><script src="config.js"></script><script src="shared.js"></script><script src="app.js"></script><script>document.getElementById('contact-form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('contact-result').textContent='Thanks — this demo form is working locally, but no message was sent.';});</script></body></html>
